---
# Node 0 — Vault SSH CA
# Generates ephemeral keypair, signs via Vault AppRole, passes paths downstream
# Runs entirely on localhost — run_once prevents race condition at scale

- name: Generate and sign ephemeral SSH key via Vault CA
  hosts: localhost
  gather_facts: false

  vars:
    vault_addr: "http://192.168.1.6:8200"
    vault_approle_path: "approle"
    vault_ssh_path: "ssh-client-signer"
    vault_ssh_role: "homelab-role"
    vault_role_id: "{{ awx_vault_role_id }}"
    vault_secret_id: "{{ awx_vault_secret_id }}"
    ssh_key_path: "/tmp/job_{{ awx_job_id }}_key"
    ssh_cert_path: "/tmp/job_{{ awx_job_id }}_key-cert.pub"
    ssh_principal: "ubuntu"

  tasks:
    - name: Ensure /tmp exists and is writable
      ansible.builtin.file:
        path: /tmp
        state: directory
        mode: '0777'

    - name: Generate ephemeral ed25519 keypair
      ansible.builtin.command:
        cmd: "ssh-keygen -t ed25519 -f {{ ssh_key_path }} -N ''"
        creates: "{{ ssh_key_path }}"

    - name: Read public key
      ansible.builtin.slurp:
        src: "{{ ssh_key_path }}.pub"
      register: pubkey_raw

    - name: Decode public key
      ansible.builtin.set_fact:
        public_key: "{{ pubkey_raw.content | b64decode }}"

    - name: Login to Vault via AppRole
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/{{ vault_approle_path }}/login"
        method: POST
        body_format: json
        body:
          role_id: "{{ vault_role_id }}"
          secret_id: "{{ vault_secret_id }}"
        validate_certs: false
        return_content: true
      register: vault_login
      no_log: true

    - name: Extract Vault token
      ansible.builtin.set_fact:
        vault_token: "{{ vault_login.json.auth.client_token }}"
      no_log: true

    - name: Sign public key via Vault SSH CA
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ vault_ssh_path }}/sign/{{ vault_ssh_role }}"
        method: POST
        body_format: json
        headers:
          X-Vault-Token: "{{ vault_token }}"
        body:
          public_key: "{{ public_key }}"
          valid_principals: "{{ ssh_principal }}"
        validate_certs: false
        return_content: true
      register: signed_cert_response

    - name: Write signed certificate to file
      ansible.builtin.copy:
        content: "{{ signed_cert_response.json.data.signed_key }}"
        dest: "{{ ssh_cert_path }}"
        mode: '0644'

    - name: Verify certificate details
      ansible.builtin.command:
        cmd: "ssh-keygen -L -f {{ ssh_cert_path }}"
      register: cert_details
      changed_when: false

    - name: Show certificate validity
      ansible.builtin.debug:
        msg: "{{ cert_details.stdout_lines }}"

    - name: Pass key paths to downstream nodes via set_stats
      ansible.builtin.set_stats:
        data:
          vault_ssh_key_path: "{{ ssh_key_path }}"
          vault_ssh_cert_path: "{{ ssh_cert_path }}"
          vault_token_to_revoke: "{{ vault_token }}"
        per_host: false
